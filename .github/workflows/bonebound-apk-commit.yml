name: Build and Commit Bonebound APK

on:
  push:
    branches:
      - bonebound-build
    paths:
      - "bonebound/**"
      - ".github/workflows/bonebound-apk-commit.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: bonebound-build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: bonebound
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit APK to build branch
        run: |
          cp bonebound/app/build/outputs/apk/debug/app-debug.apk bonebound/Bonebound-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bonebound/Bonebound-debug.apk
          git commit -m "Build Bonebound debug APK"
          git push origin HEAD:bonebound-build
